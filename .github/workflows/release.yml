name: Release and Documentation

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

jobs:
  validate-version:
    name: Validate Version Tag
    runs-on: windows-latest
    outputs:
      is_valid_version: ${{ steps.validate.outputs.is_valid_version }}
      is_prerelease: ${{ steps.validate.outputs.is_prerelease }}
      version_info: ${{ steps.validate.outputs.version_info }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Validate version format
      id: validate
      run: |
        $tag = $env:GITHUB_REF -replace 'refs/tags/', ''
        $branch = $env:GITHUB_REF -replace 'refs/heads/', ''
        Write-Host "Validating tag: $tag"
        
        $versionInfo = pwsh ./.github/workflows/scripts/Get-ProjectVersion.ps1 `
          -ProjectVersion $tag `
          -SourceBranch $env:GITHUB_REF `
          -BuildNumber $env:GITHUB_RUN_NUMBER `
          -AsJson| ConvertFrom-Json
        
        $versionInfo
        "is_valid_version=$($versionInfo.IsValidVersion)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        "is_prerelease=$($versionInfo.VersionIsPrerelease)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
        "version_info=$($versionInfo | ConvertTo-Json -Compress)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
      shell: pwsh

  create-release:
    name: Create Release Package
    runs-on: windows-latest
    needs: validate-version
    if: needs.validate-version.outputs.is_valid_version == 'true'
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Determine Version
      id: version
      run: |
        $versionInfo = '${{ needs.validate-version.outputs.version_info }}' | ConvertFrom-Json
        "version=$($versionInfo.Version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        "releaseVersion=$($versionInfo.ReleaseVersion)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        "releaseAssemblyVersion=$($versionInfo.ReleaseAssemblyVersion)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        "isPrerelease=$($versionInfo.IsPrerelease)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        Write-Host "Version determined:"
        Write-Host "  Version: $($versionInfo.Version)"
        Write-Host "  Release Version: $($versionInfo.ReleaseVersion)"
        Write-Host "  Is Prerelease: $($versionInfo.IsPrerelease)"
      shell: pwsh
    
    - name: Update Module Manifest Version
      run: |
        Write-Host "=== Updating PowerShell Module Manifest ==="
        
        $manifestPath = "GitIdentities/GitIdentities.psd1"
        $version = "${{ steps.version.outputs.version }}"
        
        # Read existing manifest
        $manifestContent = Get-Content -Path $manifestPath -Raw
        
        # Update ModuleVersion - simple pattern matching
        $manifestContent = $manifestContent -replace "ModuleVersion = '.*'", "ModuleVersion = '$version'"
        
        # Write back to file
        Set-Content -Path $manifestPath -Value $manifestContent -Encoding UTF8
        Write-Host "✓ Module manifest updated: $manifestPath (version: $version)"
      shell: pwsh
    
    - name: Create Module Bundle
      run: |
        Write-Host "=== Creating Release Bundle ==="
        
        $version = "${{ steps.version.outputs.version }}"
        $releaseDir = "release/GitIdentities-$version"
        
        # Create release directory structure
        New-Item -Path $releaseDir -ItemType Directory -Force | Out-Null
        
        # Copy module files
        Copy-Item -Path "GitIdentities/*" -Destination $releaseDir -Recurse -Force
        
        # Create ZIP package
        $zipPath = "GitIdentities-v$version.zip"
        Compress-Archive -Path $releaseDir -DestinationPath $zipPath
        
        Write-Host "✓ Release package created: $zipPath"
        Write-Host "Package contents:"
        Get-ChildItem $releaseDir -Recurse | ForEach-Object { Write-Host "  $($_.FullName)" }
      shell: pwsh
    
    - name: Upload Release Asset
      uses: actions/upload-artifact@v4
      with:
        name: GitIdentities-v$version
        path: GitIdentities-*.zip
    
    - name: Generate Changelog from Commits
      run: |
        pwsh ./.github/workflows/scripts/Generate-Changelog.ps1 `
          -OutputPath release_notes.txt `
          -RepoOwner "${{ github.repository_owner }}" `
          -RepoName "${{ github.event.repository.name }}"
      shell: pwsh
    
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: GitIdentities-*.zip
        draft: false
        prerelease: ${{ steps.version.outputs.is_prerelease }}
        generate_release_notes: false
        body_path: release_notes.txt
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Publish to PowerShell Gallery
      if: steps.version.outputs.is_prerelease == 'false'
      run: |
        Write-Host "=== Publishing to PowerShell Gallery ==="
        
        $version = "${{ steps.version.outputs.version }}"
        $modulePath = "GitIdentities"
        $apiKey = "${{ secrets.POWERSHELL_GALLERY_API_KEY }}"
        
        if (-not $apiKey) {
          Write-Host "⚠️ POWERSHELL_GALLERY_API_KEY not configured. Skipping publication."
          exit 0
        }
        
        try {
          Publish-Module -Path $modulePath -NuGetApiKey $apiKey -Repository PSGallery -Force
          Write-Host "✓ Module published to PowerShell Gallery (v$version)"
        } catch {
          Write-Host "❌ Failed to publish module: $_"
          exit 1
        }
      shell: pwsh

  update-documentation:
    name: Update Documentation
    runs-on: ubuntu-latest
    needs: validate-version
    if: needs.validate-version.outputs.is_valid_version == 'true'
    permissions:
      contents: write
      pages: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
      
    - name: Check if tag is on master
      id: check_master
      run: |
        $tag = $env:GITHUB_REF -replace 'refs/tags/', ''
        Write-Host "Checking tag: $tag"
        $branches = git branch -r --contains $tag
        Write-Host "Tag is on branches: $branches"
        
        if ($branches -match 'origin/master|origin/main') {
          "is_master=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "✓ Tag is on master/main branch"
        } elseif ($branches -match 'origin/github-pipelines') {
          "is_master=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "✓ Tag is on github-pipelines branch"
        } else {
          "is_master=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "⚠️ Tag is not on master/main/github-pipelines branch"
        }
      shell: pwsh

    - name: Setup Node.js for documentation tools
      uses: actions/setup-node@v3
      with:
        node-version: '18'
    
    - name: Generate PowerShell Help Documentation  
      run: |
        # Install PowerShell on Ubuntu
        sudo apt-get update
        sudo apt-get install -y wget apt-transport-https software-properties-common
        wget -q "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
        sudo dpkg -i packages-microsoft-prod.deb
        sudo apt-get update
        sudo apt-get install -y powershell
        
        # Generate help documentation using external script
        pwsh ./.github/workflows/scripts/Generate-MarkdownDocs.ps1
        Write-Host '✓ Documentation generation completed'
      shell: pwsh
    
    - name: Deploy to GitHub Pages
      if: steps.check_master.outputs.is_master == 'true'
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs
        publish_branch: gh-pages
        commit_message: 'docs: update PowerShell module documentation'