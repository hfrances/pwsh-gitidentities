name: GitIdentities Module Tests

on:
  push:
    branches: [ master, develop, github-pipelines ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  test-powershell:
    name: Test PowerShell Module
    runs-on: windows-latest
    
    strategy:
      matrix:
        powershell-version: ['5.1', '7.x']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup PowerShell ${{ matrix.powershell-version }}
      uses: actions/setup-powershell@v1
      if: matrix.powershell-version == '7.x'
      with:
        powershell-version: ${{ matrix.powershell-version }}
    
    - name: Install Git (ensure latest)
      run: |
        winget install --id Git.Git -e --source winget --accept-package-agreements --accept-source-agreements
        # Refresh PATH
        $env:PATH = [System.Environment]::GetEnvironmentVariable("PATH","Machine") + ";" + [System.Environment]::GetEnvironmentVariable("PATH","User")
      shell: pwsh
      
    - name: Verify Prerequisites
      run: |
        Write-Host "PowerShell Version: $($PSVersionTable.PSVersion)"
        Write-Host "Git Version: $(git --version)"
        Write-Host "SSH-Keygen Available: $((Get-Command ssh-keygen -ErrorAction SilentlyContinue) -ne $null)"
        Write-Host "OpenSSH Path: $((Get-Command ssh-keygen -ErrorAction SilentlyContinue).Source)"
      shell: pwsh
    
    - name: Run Module Syntax Validation
      run: |
        Write-Host "=== Module Syntax Validation ==="
        $moduleFiles = Get-ChildItem -Path "GitIdentities" -Recurse -Filter "*.ps1"
        $errors = @()
        foreach ($file in $moduleFiles) {
          Write-Host "Checking: $($file.FullName)"
          try {
            $null = [System.Management.Automation.PSParser]::Tokenize((Get-Content $file.FullName -Raw), [ref]$null)
            Write-Host "  ✓ OK" -ForegroundColor Green
          }
          catch {
            Write-Host "  ✗ SYNTAX ERROR: $($_.Exception.Message)" -ForegroundColor Red
            $errors += "$($file.Name): $($_.Exception.Message)"
          }
        }
        if ($errors.Count -gt 0) {
          Write-Host "`n=== SYNTAX ERRORS FOUND ===" -ForegroundColor Red
          $errors | ForEach-Object { Write-Host "  $_" -ForegroundColor Red }
          exit 1
        }
        Write-Host "`n✓ All files passed syntax validation" -ForegroundColor Green
      shell: pwsh
    

    - name: Prepare test user home and .gitconfig
      run: |
        $TestUser = "patata"
        $TestUserHome = "C:\\Users\\$TestUser"
        if (-not (Test-Path $TestUserHome)) {
          New-Item -Path $TestUserHome -ItemType Directory -Force | Out-Null
        }
        $gitconfig = Join-Path $TestUserHome ".gitconfig"
        if (-not (Test-Path $gitconfig)) {
          Set-Content -Path $gitconfig -Value "" -Encoding UTF8
        }
        Write-Host "✓ Test user home and .gitconfig prepared at $TestUserHome" -ForegroundColor Green
      shell: pwsh

    - name: Install Pester
      run: |
        if (-not (Get-Module -ListAvailable -Name Pester)) {
          Install-Module -Name Pester -Force -SkipPublisherCheck
        }
        Import-Module Pester -Force
        Write-Host "✓ Pester installed and imported" -ForegroundColor Green
      shell: pwsh

    - name: Run Pester Tests
      run: |
        # Run all Pester tests in the Tests folder
        Invoke-Pester -Path ./Tests -Output Detailed
      shell: pwsh
    
    - name: Upload Test Results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.os }}-ps${{ matrix.powershell-version }}
        path: |
          Tests/*TestResults.xml
          Tests/*Coverage.xml
        retention-days: 30

    - name: Generate Test Report
      run: |
        Write-Host "=== CI Test Summary ==="
        Write-Host "✓ Module syntax validation passed"
        Write-Host "✓ Pester tests executed"
        Write-Host ""
        Write-Host "PowerShell Version: $($PSVersionTable.PSVersion)"
        Write-Host "OS: $env:OS"
        Write-Host "Test Date: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC')"
        # Display test artifacts if they exist
        if (Test-Path "Tests\*TestResults.xml") {
          Write-Host "`nTest result files created:"
          Get-ChildItem "Tests\*TestResults.xml" | ForEach-Object { Write-Host "  - $($_.Name)" }
        }
      shell: pwsh
      
  # Optional: Test on different OS (if you want cross-platform testing)
  test-cross-platform:
    name: Cross-Platform Compatibility Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install PowerShell
        run: |
          # Install PowerShell on Ubuntu
          sudo apt-get update
          sudo apt-get install -y wget apt-transport-https software-properties-common
          wget -q "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
          sudo dpkg -i packages-microsoft-prod.deb
          sudo apt-get update
          sudo apt-get install -y powershell
      - name: Test Module Syntax (Linux)
        run: |
          pwsh -c "
          Write-Host '=== Cross-Platform Syntax Check ==='
          $moduleFiles = Get-ChildItem -Path 'GitIdentities' -Recurse -Filter '*.ps1'
          $errors = @()
          foreach ($file in $moduleFiles) {
            Write-Host ('Checking: ' + $file.FullName)
            try {
              $null = [System.Management.Automation.PSParser]::Tokenize((Get-Content $file.FullName -Raw), [ref]$null)
              Write-Host '  ✓ OK' -ForegroundColor Green
            }
            catch {
              Write-Host ('  ✗ SYNTAX ERROR: ' + $_.Exception.Message) -ForegroundColor Red
              $errors += ($file.Name + ': ' + $_.Exception.Message)
            }
          }
          if ($errors.Count -gt 0) {
            Write-Host 'SYNTAX ERRORS FOUND:' -ForegroundColor Red
            $errors | ForEach-Object { Write-Host ('  ' + $_) -ForegroundColor Red }
            exit 1
          }
          Write-Host '✓ Cross-platform syntax validation passed' -ForegroundColor Green
          "